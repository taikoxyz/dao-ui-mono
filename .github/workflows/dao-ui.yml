name: DAO UI CI/CD

on:
    push:
        paths:
          - "packages/ui/**"
        tags:
          - "dao-ui-v*"
    
    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
        - "packages/ui/**"
        branches-ignore:
            - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    test:
        runs-on: [arc-runner-set]
        steps:
            - name: Install Git
              run: sudo apt-get update && sudo apt-get install -y git

            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install pnpm dependencies
              uses: ./.github/actions/install-pnpm-dependencies

            - name: Lint
              run: pnpm --filter dao-ui lint

            - name: Type-check
              run: pnpm --filter dao-ui type-check

            - name: Run tests
              run: pnpm --filter dao-ui test

    deploy_ui_mainnet_preview:
        needs: test
        if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') }}
        uses: ./.github/workflows/repo--vercel-deploy.yml
        with:
            environment: "preview"
            flags: ""
        secrets:
            vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID_DAO_MAINNET }}
            vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
            vercel_token: ${{ secrets.VERCEL_TOKEN }}       
    
    deploy_ui_mainnet_production:
        needs: test
        if: ${{ startsWith(github.ref, 'refs/tags/dao-ui-v') }}
        uses: ./.github/workflows/repo--vercel-deploy.yml
        with:
            environment: "production"
            flags: "--prod"
        secrets:
            vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID_DAO_MAINNET }}
            vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
            vercel_token: ${{ secrets.VERCEL_TOKEN }}