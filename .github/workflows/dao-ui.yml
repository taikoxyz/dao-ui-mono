name: DAO UI CI/CD

on:
    push:
        paths:
          - "packages/ui/**"
        tags:
          - "dao-ui-v*"

    pull_request:
        types: [opened, synchronize, reopened, ready_for_review]
        paths:
        - "packages/ui/**"
        branches-ignore:
            - release-please--branches--**

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
    checks:
        # Fork guard matches repo--vercel-deploy.yml: this runs PR code on
        # self-hosted runners, so untrusted fork PRs must never trigger it.
        if: ${{ github.event.pull_request.draft == false && !startsWith(github.head_ref, 'release-please') && github.actor != 'dependabot' && github.event.pull_request.head.repo.fork == false }}
        runs-on: [arc-runner-set]
        defaults:
            run:
                working-directory: packages/ui
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Install dependencies
              uses: ./.github/actions/install-pnpm-dependencies

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: latest

            - name: Type-check
              run: bun run type-check

            - name: Test
              run: bun test

            # Non-blocking for now: the package has pre-existing prettier drift in
            # files unrelated to current work (CHANGELOG.md and a few proposal/l2
            # pages). Flip to a required check once those are formatted.
            - name: Prettier
              run: bun run format:check
              continue-on-error: true

    deploy_ui_mainnet_preview:
        if: ${{ github.event.pull_request.draft == false  && !startsWith(github.head_ref, 'release-please') }}
        uses: ./.github/workflows/repo--vercel-deploy.yml
        with:
            environment: "preview"
            flags: ""
        secrets:
            vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID_DAO_MAINNET }}
            vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
            vercel_token: ${{ secrets.VERCEL_TOKEN }}

    deploy_ui_mainnet_production:
        if: ${{ startsWith(github.ref, 'refs/tags/dao-ui-v') }}
        uses: ./.github/workflows/repo--vercel-deploy.yml
        with:
            environment: "production"
            flags: "--prod"
        secrets:
            vercel_project_id: ${{ secrets.VERCEL_PROJECT_ID_DAO_MAINNET }}
            vercel_org_id: ${{ secrets.VERCEL_ORG_ID }}
            vercel_token: ${{ secrets.VERCEL_TOKEN }}
