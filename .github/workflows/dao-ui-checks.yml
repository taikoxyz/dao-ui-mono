name: DAO UI Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "packages/ui/**"
    branches-ignore:
      - release-please--branches--**
  push:
    paths:
      - "packages/ui/**"

concurrency:
  group: dao-ui-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    runs-on: [arc-runner-set]
    defaults:
      run:
        working-directory: packages/ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies
        uses: ./.github/actions/install-pnpm-dependencies

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Type-check
        run: bun run type-check

      - name: Test
        run: bun test

      # Non-blocking for now: the package has pre-existing prettier drift in
      # files unrelated to current work. Flip to a required check once those
      # are formatted (CHANGELOG.md and a handful of proposal/l2 pages).
      - name: Prettier
        run: bun run format:check
        continue-on-error: true
